    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Inside Deutsche Bank: the banking data leak that travelled around the world",

    <style>

  <body data-sveltekit-preload-data="hover">
    <!-- the app is client-rendered; this is what crawlers and no-JS visitors get -->
    <noscript>
      <main style="max-width: 640px; margin: 48px auto; padding: 0 16px; color: #e8ecf6; font: 16px/1.5 system-ui, sans-serif">
        <h1>Inside Deutsche Bank: the banking data leak that travelled around the world</h1>
        <p>
          The Inside Deutsche Bank investigation was published on 16 November 2026. Over 230
          journalists from 50 countries investigated the leak, which was then taken up by the
          global media. This interactive 3D globe replays that coverage: 1,546 news stories in
          22 languages, each appearing at the place and moment it was published.
        </p>
        <p>The globe needs JavaScript and WebGL. Read the investigation at <a style="color: #64b5f6" href="https://www.inside-db.com/">inside-db.com</a>.</p>
      </main>
    </noscript>
